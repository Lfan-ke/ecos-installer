[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecos-release"
version = "0.1.0"
description = "ECC installer generator, archive validation, and publication tooling"
readme = "docs/superpowers/specs/2026-08-28-ecc-installer-design.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ecos-release = "ecos_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecos_release = ["templates/*.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_artifact: downloads and installs real ECC/toolchain archives",
]
addopts = ["-q"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
