name: Publish ECC installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact ECC tag to publish, for example v0.1.0-alpha.11
        required: true
        type: string

concurrency:
  group: installer-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run installer tests
        run: python -m pytest -m "not real_artifact"

      - name: Generate installer from validated archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ecos_release generate \
            --tag "${{ inputs.tag }}" \
            --validate-archives \
            --verify-cnb \
            --archive-dir "${RUNNER_TEMP}/ecc-archives" \
            --output dist/ecc-installer.sh

      - name: Syntax-check generated installer
        run: |
          dash -n dist/ecc-installer.sh
          bash -n dist/ecc-installer.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s dash dist/ecc-installer.sh
          fi

      - name: Real-artifact toolchain install
        env:
          ECC_REAL_ARTIFACT: "1"
        run: python -m pytest -m real_artifact

      - name: Publish to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ecc-install-script
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          OSS_PUBLIC_BASE: https://ecc-install-script.oss-cn-beijing.aliyuncs.com
        run: |
          python -m ecos_release publish \
            --tag "${{ inputs.tag }}" \
            --installer dist/ecc-installer.sh
